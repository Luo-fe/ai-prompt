<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #1a1a2e;
  }
  body {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
    color: #e0e0e0;
    -webkit-app-region: no-drag;
  }
  .splash-container {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    width: 100%; height: 100%;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  }
  .icon-container {
    width: 80px; height: 80px;
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 24px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    background: rgba(255,255,255,0.05);
    display: flex; align-items: center; justify-content: center;
  }
  .icon-container img {
    width: 64px; height: 64px;
    object-fit: contain;
  }
  .app-name {
    font-size: 22px; font-weight: 600;
    letter-spacing: 1px;
    margin-bottom: 8px;
    color: #c8d8f0;
  }
  .app-version {
    font-size: 13px;
    color: rgba(255,255,255,0.4);
    margin-bottom: 32px;
  }
  .loader {
    width: 140px; height: 3px;
    background: rgba(255,255,255,0.08);
    border-radius: 2px;
    overflow: hidden;
  }
  .loader-bar {
    width: 0%; height: 100%;
    background: linear-gradient(90deg, #4a90d9, #a0c4ff);
    border-radius: 2px;
    animation: load 1.6s ease-in-out infinite;
  }
  @keyframes load {
    0% { width: 0%; margin-left: 0; }
    50% { width: 50%; margin-left: 25%; }
    100% { width: 0%; margin-left: 100%; }
  }
  .loading-text {
    margin-top: 14px;
    font-size: 12px;
    color: rgba(255,255,255,0.3);
  }
</style>
</head>
<body>
  <div class="splash-container">
    <div class="icon-container">
      <img src="../icon.png" alt="icon" onerror="this.style.display='none'">
    </div>
    <div class="app-name">Luo-fe 本地提示词管理器</div>
    <div class="app-version">v1.3</div>
    <div class="loader"><div class="loader-bar"></div></div>
    <div class="loading-text">正在加载...</div>
  </div>
</body>
</html>
