<html lang="zh-CN"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luo-fe的本地提示词管理器 v1.1</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
</head>
<body>
    <div class="bg-image-overlay" id="bg-image-overlay"></div>
    <div class="container">
        <header class="navbar" id="navbar">
            <div class="titlebar-drag">
                <div class="logo">
                    <h1>Luo-fe的本地提示词管理器 v1.1</h1>
                </div>
            </div>
            <div class="nav-actions">
                <button id="settings-btn" class="btn btn-secondary">
                    <i class="fa fa-cog"></i> 设置
                </button>
                <button id="translate-all-btn" class="btn btn-secondary">
                    <i class="fa fa-language"></i> 一键翻译
                </button>
                <div class="window-controls" id="window-controls">
                    <button class="window-control-btn minimize" id="win-minimize" title="最小化">
                        <svg width="12" height="12" viewBox="0 0 12 12"><rect y="5" width="12" height="1.5" fill="currentColor"/></svg>
                    </button>
                    <button class="window-control-btn maximize" id="win-maximize" title="最大化">
                        <svg width="12" height="12" viewBox="0 0 12 12"><rect x="1" y="1" width="10" height="10" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
                    </button>
                    <button class="window-control-btn close" id="win-close" title="关闭">
                        <svg width="12" height="12" viewBox="0 0 12 12"><path d="M1 1L11 11M11 1L1 11" stroke="currentColor" stroke-width="1.5"/></svg>
                    </button>
                </div>
            </div>
        </header>

        <main class="main-content">
            <aside class="category-panel">
                <div class="category-header">
                    <h2>提示词分类</h2>
                    <button id="add-category-btn" class="btn btn-primary">
                        新增分类
                    </button>
                </div>
                <ul id="category-list" class="category-list">
                </ul>
            </aside>

            <section class="prompt-panel">
                <div class="prompt-header">
                    <h2 id="current-category-title">请选择分类</h2>
                    <div class="prompt-actions">
                        <button id="select-all-btn" class="btn btn-secondary">
                            <i class="fa fa-check-square-o"></i> 全选
                        </button>
                        <button id="deselect-all-btn" class="btn btn-secondary">
                            <i class="fa fa-square-o"></i> 取消全选
                        </button>
                        <button id="edit-prompts-btn" class="btn btn-secondary">
                            <i class="fa fa-pencil"></i> 编辑提示词
                        </button>
                    </div>
                </div>
                <div id="prompt-list" class="prompt-list">
                    <div class="no-prompts">请从左侧选择一个分类</div>
                </div>
            </section>

            <aside class="preview-panel">
                <div class="preview-resize-handle" id="preview-resize-handle"></div>
                <div class="preview-header">
                    <h2>已选提示词</h2>
                    <button id="clear-selected-btn" class="btn btn-danger">
                        <i class="fa fa-trash"></i> 清空
                    </button>
                </div>
                <div id="selected-prompts" class="selected-prompts">
                    <div class="no-selected">暂无选中的提示词</div>
                </div>
                <div class="selected-prompts-resize-handle" id="selected-prompts-resize-handle"></div>
                
                <div class="preview-section">
                    <h3>组合预览</h3>
                    <div id="preview-output" class="preview-output">
                        <p class="placeholder">请选择提示词以预览组合效果</p>
                    </div>
                </div>
                
                <div class="export-section">
                    <button id="export-btn" class="btn btn-primary btn-large">
                        <i class="fa fa-download"></i> 导出提示词
                    </button>
                </div>
                
                <div class="random-section">
                    <h3>随机生成</h3>
                    <div class="random-controls">
                        <div class="category-selection">
                            <label>选择类别:</label>
                            <div id="random-category-selector" class="category-checkboxes">
                            </div>
                        </div>
                        <button id="random-generate-btn" class="btn btn-primary btn-large">
                            <i class="fa fa-random"></i> 随机来一组
                        </button>
                    </div>
                    <div id="random-result" class="random-result">
                        <p class="placeholder">请选择类别并点击"随机来一组"</p>
                    </div>
                </div>
            </aside>
        </main>
    </div>

    <div id="category-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>分类管理</h3>
                <span class="close">×</span>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="new-category-name">新分类名称:</label>
                    <input type="text" id="new-category-name" placeholder="输入分类名称">
                    <button id="save-category-btn" class="btn btn-primary">添加分类</button>
                </div>
                <div class="custom-categories">
                    <h4>自定义分类</h4>
                    <ul id="custom-category-list">
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <div id="prompt-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="prompt-modal-title">提示词管理</h3>
                <span class="close">×</span>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="new-prompt-text">新提示词:</label>
                    <input type="text" id="new-prompt-text" placeholder="输入提示词文本">
                    <button id="save-prompt-btn" class="btn btn-primary">添加提示词</button>
                </div>
                <div class="form-group">
                    <label for="batch-import">批量导入:</label>
                    <textarea id="batch-import" placeholder="每行输入一个提示词，批量导入"></textarea>
                    <button id="batch-import-btn" class="btn btn-secondary">批量导入</button>
                </div>
                <div class="prompts-list">
                    <h4>提示词列表</h4>
                    <ul id="category-prompts-list">
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <div id="export-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>导出设置</h3>
                <span class="close">×</span>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>导出格式:</label>
                    <div class="radio-group">
                        <label><input type="radio" name="export-format" value="text" checked=""> 纯文本</label>
                        <label><input type="radio" name="export-format" value="json"> JSON</label>
                        <label><input type="radio" name="export-format" value="markdown"> Markdown</label>
                    </div>
                </div>
                <div class="form-group" id="delimiter-option">
                    <label for="delimiter">分隔符:</label>
                    <select id="delimiter">
                        <option value=",">逗号 (,)</option>
                        <option value=" ">空格 ( )</option>
                        <option value="
">换行</option>
                        <option value="; ">分号 (;)</option>
                        <option value="custom">自定义</option>
                    </select>
                    <input type="text" id="custom-delimiter" placeholder="自定义分隔符" style="display: none;">
                </div>
                <div class="form-group">
                    <label for="export-preview">导出预览:</label>
                    <textarea id="export-preview" readonly=""></textarea>
                </div>
                <div class="modal-actions">
                    <button id="copy-to-clipboard-btn" class="btn btn-secondary">
                        <i class="fa fa-clipboard"></i> 复制到剪贴板
                    </button>
                    <button id="download-file-btn" class="btn btn-primary">
                        <i class="fa fa-download"></i> 下载文件
                    </button>
                </div>
            </div>
        </div>
    </div>

    <button id="mobile-toggle" class="mobile-toggle">
        <i class="fa fa-bars"></i>
    </button>

    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>设置</h3>
                <span class="close">&times;</span>
            </div>
            <div class="modal-body">
                <div class="settings-section">
                    <h4>背景设置</h4>
                    <div class="bg-settings-section">
                        <div class="bg-preview-container" id="bg-preview-container">
                            <span class="bg-preview-placeholder" id="bg-preview-placeholder">未设置背景图片</span>
                        </div>
                        <div class="bg-actions">
                            <button id="bg-upload-btn" class="btn btn-info btn-small">
                                <i class="fa fa-image"></i> 选择图片
                            </button>
                            <button id="bg-clear-btn" class="btn btn-danger btn-small">
                                <i class="fa fa-trash"></i> 清除背景
                            </button>
                            <input type="file" id="bg-file-input" accept=".jpg,.jpeg,.png,.bmp,.webp,.gif" style="display: none;">
                        </div>
                        <div class="panel-style-control">
                            <label>面板风格:</label>
                            <div class="panel-style-options">
                                <label class="panel-style-option">
                                    <input type="radio" name="panel-style" value="frosted" id="panel-style-frosted" checked>
                                    <span class="panel-style-label">
                                        <span class="style-icon style-icon-frosted"></span>
                                        磨砂玻璃
                                    </span>
                                </label>
                                <label class="panel-style-option">
                                    <input type="radio" name="panel-style" value="transparent" id="panel-style-transparent">
                                    <span class="panel-style-label">
                                        <span class="style-icon style-icon-transparent"></span>
                                        全透明
                                    </span>
                                </label>
                            </div>
                        </div>
                        <div class="opacity-control">
                            <label>面板透明度:</label>
                            <input type="range" id="panel-opacity-slider" class="opacity-slider" min="0" max="100" value="95" step="1">
                            <span class="opacity-value" id="panel-opacity-value">95%</span>
                        </div>
                    </div>
                </div>
                <div class="settings-section">
                    <h4>翻译设置</h4>
                    <div class="setting-item">
                        <label class="switch">
                            <input type="checkbox" id="translation-enabled">
                            <span class="slider round"></span>
                        </label>
                        <span>启用翻译功能</span>
                    </div>
                    <div class="setting-item">
                        <label class="switch">
                            <input type="checkbox" id="online-translation">
                            <span class="slider round"></span>
                        </label>
                        <span>使用在线翻译API</span>
                    </div>
                    <div class="setting-item">
                        <label class="switch">
                            <input type="checkbox" id="auto-translate-new">
                            <span class="slider round"></span>
                        </label>
                        <span>自动翻译新添加的提示词</span>
                    </div>
                    <div class="setting-item">
                        <label class="switch">
                            <input type="checkbox" id="show-translation-preview">
                            <span class="slider round"></span>
                        </label>
                        <span>在预览中显示翻译</span>
                    </div>
                    <div class="setting-item">
                        <label for="translation-api">翻译API地址:</label>
                        <input type="text" id="translation-api" class="form-input" placeholder="https://api.mymemory.translated.net/get">
                    </div>
                </div>
                <div class="settings-section">
                    <h4>数据管理</h4>
                    <button id="clean-duplicates-btn" class="btn btn-warning">清理重复提示词</button>
                    <button id="export-all-data-btn" class="btn btn-info">导出所有数据</button>
                    <button id="import-data-btn" class="btn btn-info">导入数据</button>
                    <input type="file" id="import-file-input" accept=".json" style="display: none;">
                    <hr style="margin: 0.75rem 0; border: none; border-top: 1px solid var(--border-color);">
                    <button id="export-csv-btn" class="btn btn-info">导出CSV</button>
                    <button id="import-csv-btn" class="btn btn-info">导入CSV</button>
                    <input type="file" id="import-csv-file-input" accept=".csv" style="display: none;">
                </div>
            </div>
            <div class="modal-footer">
                <button id="save-settings-btn" class="btn btn-primary">保存设置</button>
                <button id="cancel-settings-btn" class="btn btn-secondary">取消</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body></html>
